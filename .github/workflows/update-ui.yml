name: Update Profile Assets & Metrics

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-ui.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-ui
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Run generator unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Refresh SVG assets and README metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Alhibb
        run: python3 scripts/build_ui.py

      - name: Commit updated profile outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh public GitHub activity and SVG assets [skip ci]"
            git push
          fi
